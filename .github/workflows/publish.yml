name: Publish to npm and GitHub Packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'dev/**'
      - 'examples/**'
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Required for creating releases
      packages: write # Required for GitHub Packages
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          fetch-depth: 0  # Fetch all history for version-check to search commits

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Run linter
        timeout-minutes: 3
        run: pnpm lint

      - name: Locate disposable PostgreSQL binaries
        timeout-minutes: 1
        run: |
          pg_test_bin="$(pg_config --bindir)"
          test -x "$pg_test_bin/initdb"
          test -x "$pg_test_bin/pg_ctl"
          echo "PG_TEST_BIN=$pg_test_bin" >> "$GITHUB_ENV"

      - name: Run tests
        timeout-minutes: 8
        run: pnpm test:int --run
        env:
          NODE_ENV: test
          RUN_IDENTITY_ADAPTER_TESTS: '1'
          RUN_IDENTITY_POSTGRES_TESTS: '1'

      - name: Build
        timeout-minutes: 5
        run: pnpm build

      - name: Check if version exists on npm
        timeout-minutes: 3
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already exists on npm"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PACKAGE_VERSION does not exist on npm, will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update npm for Trusted Publishers
        timeout-minutes: 3
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        timeout-minutes: 3
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-release"
          env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG npm publish "$RUNNER_TEMP/npm-release/payload-auth-cookie-${{ steps.check.outputs.version }}.tgz" --provenance --access public --registry https://registry.npmjs.org --loglevel verbose

      - name: Modify package.json for GitHub Packages
        timeout-minutes: 3
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@' + process.env.GITHUB_REPOSITORY_OWNER.toLowerCase() + '/' + pkg.name;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Setup Node.js for GitHub Packages
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Check if version exists on GitHub Packages
        timeout-minutes: 3
        id: github-package
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { spawnSync } from 'node:child_process'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const result = spawnSync('npm', [
            'view', `${pkg.name}@${pkg.version}`, 'version', '--json',
            '--registry', 'https://npm.pkg.github.com',
          ], { encoding: 'utf8' })
          let response
          try { response = JSON.parse(result.stdout) } catch {}
          if (result.status === 0 && response === pkg.version) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_publish=false\n')
            console.log(`${pkg.name}@${pkg.version} already exists; skipping mirror upload`)
          } else if (result.status !== 0 && response?.error?.code === 'E404') {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_publish=true\n')
            console.log(`${pkg.name}@${pkg.version} does not exist; publishing mirror`)
          } else {
            process.stderr.write(result.stderr || '')
            throw new Error(`GitHub Packages version lookup failed (exit ${result.status})`)
          }
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        timeout-minutes: 3
        if: steps.github-package.outputs.should_publish == 'true'
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/github-release"
          archive=$(node -p "require('./package.json').name.slice(1).replace('/', '-') + '-' + require('./package.json').version + '.tgz'")
          npm publish "$RUNNER_TEMP/github-release/$archive" --access public --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Packages artifact
        timeout-minutes: 3
        run: |
          package=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          archive=$(node -p "require('./package.json').name.slice(1).replace('/', '-') + '-' + require('./package.json').version + '.tgz'")
          mkdir -p "$RUNNER_TEMP/github-verification/extracted"
          for attempt in 1 2 3; do
            if npm pack "$package" --pack-destination "$RUNNER_TEMP/github-verification" --registry https://npm.pkg.github.com; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          tar -xzf "$RUNNER_TEMP/github-verification/$archive" -C "$RUNNER_TEMP/github-verification/extracted"
          diff -r dist "$RUNNER_TEMP/github-verification/extracted/package/dist"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          const expected = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const directory = path.join(process.env.RUNNER_TEMP, 'github-verification/extracted/package')
          const actual = JSON.parse(fs.readFileSync(path.join(directory, 'package.json'), 'utf8'))
          assert.equal(actual.name, expected.name)
          assert.equal(actual.version, expected.version)
          assert.deepEqual(actual.exports, expected.publishConfig.exports)
          for (const entry of Object.values(actual.exports)) {
            for (const target of Object.values(entry)) assert.ok(fs.existsSync(path.join(directory, target)))
          }
          console.log(`Verified registry download of ${actual.name}@${actual.version}: runtime matches build and all exports resolve`)
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        timeout-minutes: 3
        if: steps.check.outputs.should_publish == 'true'
        run: |
          gh release create "v${{ steps.check.outputs.version }}" \
            --title "v${{ steps.check.outputs.version }}" \
            --notes "Release ${{ steps.check.outputs.version }}

          See [CHANGELOG.md](CHANGELOG.md) for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
