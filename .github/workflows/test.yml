name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Run linter
        timeout-minutes: 3
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Locate disposable PostgreSQL binaries
        timeout-minutes: 1
        run: |
          pg_test_bin="$(pg_config --bindir)"
          test -x "$pg_test_bin/initdb"
          test -x "$pg_test_bin/pg_ctl"
          echo "PG_TEST_BIN=$pg_test_bin" >> "$GITHUB_ENV"

      - name: Run integration tests
        timeout-minutes: 8
        run: pnpm test:int --run
        env:
          NODE_ENV: test
          RUN_IDENTITY_ADAPTER_TESTS: '1'
          RUN_IDENTITY_POSTGRES_TESTS: '1'

  e2e:
    # Only run on pushes to main to keep PRs fast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Run database migrations
        timeout-minutes: 3
        run: pnpm payload migrate
        working-directory: dev
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/payload_test
          PAYLOAD_SECRET: test-secret-for-ci-only
          SSO_JWT_SECRET: test-jwt-secret-for-ci

      - name: Run E2E tests
        timeout-minutes: 8
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/payload_test
          PAYLOAD_SECRET: test-secret-for-ci-only
          SSO_JWT_SECRET: test-jwt-secret-for-ci

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Setup pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Build
        timeout-minutes: 5
        run: pnpm build
